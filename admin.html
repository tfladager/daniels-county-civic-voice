<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Daniels County Civic Voice</title>
<link rel="stylesheet" href="style.css">
<style>
  label { font-family:'Arial',sans-serif; font-size:13px; color:var(--text-muted); display:block; margin-bottom:5px; }
  input[type=text],input[type=password],textarea { width:100%; padding:9px 12px; font-size:14px; font-family:'Arial',sans-serif; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-surface); color:var(--text); outline:none; }
  input:focus,textarea:focus { border-color:var(--blue); }
  textarea { resize:vertical; min-height:70px; }
  .field { margin-bottom:1rem; }
  .btn-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1.5rem; }
  .metric { background:var(--bg); border:1px solid var(--border-light); border-radius:var(--radius); padding:14px; text-align:center; }
  .metric .num { font-size:26px; font-weight:bold; }
  .metric .lbl { font-family:'Arial',sans-serif; font-size:12px; color:var(--text-muted); margin-top:3px; }
  .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
  .tab { padding:9px 18px; font-family:'Arial',sans-serif; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; color:var(--text-muted); margin-bottom:-1px; }
  .tab.active { border-bottom-color:var(--blue); color:var(--blue); font-weight:bold; }
  .q-card { border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:1.25rem; margin-bottom:1rem; background:var(--bg); }
  .q-top { display:flex; align-items:flex-start; gap:12px; }
  .q-body { flex:1; }
  .q-text { font-size:15px; font-weight:bold; margin-bottom:6px; }
  .q-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:'Arial',sans-serif; font-size:12px; color:var(--text-muted); }
  .q-actions { display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:5px; font-family:'Arial',sans-serif; font-size:13px; }
  .bar-label { width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); }
  .bar-track { flex:1; background:var(--bg-surface2); border-radius:4px; height:18px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--blue); border-radius:4px; transition:width 0.4s; }
  .bar-count { width:32px; text-align:right; font-weight:bold; }
  .bar-pct { width:34px; color:var(--text-hint); }
  .opt-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .opt-row { display:flex; align-items:center; gap:8px; }
  .opt-row input { flex:1; }
  .opt-rm { width:30px; height:30px; border:none; background:none; cursor:pointer; color:var(--text-muted); font-size:18px; flex-shrink:0; }
  .comment-item { font-family:'Arial',sans-serif; font-size:13px; padding:6px 10px; background:var(--bg-surface); border-radius:var(--radius); margin-bottom:4px; }
  .share-url { background:var(--bg-surface2); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; font-family:'Courier New',monospace; font-size:12px; color:var(--text-muted); word-break:break-all; margin-bottom:6px; }
  .login-wrap { max-width:360px; margin:3rem auto; }
  .loading { text-align:center; padding:3rem; font-family:'Arial',sans-serif; color:var(--text-muted); }
  .spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--blue-mid); border-top-color:var(--blue); border-radius:50%; animation:spin 0.6s linear infinite; margin-bottom:0.5rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .badge-open { background:var(--green-light); color:var(--green); }
  .badge-draft { background:var(--amber-light); color:var(--amber); }
  .badge-closed { background:var(--gray-100); color:var(--gray-600); }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <div class="nav-seal">DC</div>
      <div>
        <div class="nav-title">Daniels County Civic Voice</div>
        <div class="nav-sub">Commissioner Admin</div>
      </div>
    </a>
    <div style="display:flex;gap:8px">
      <a href="index.html" class="btn btn-outline btn-sm">&#8592; View site</a>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="display:none" id="logout-btn">Sign out</button>
    </div>
  </div>
</nav>

<div class="page">
  <div id="admin-root"><div class="loading"><div class="spinner"></div><br>Loading…</div></div>
</div>

<footer class="site-footer">
  <div>Daniels County Civic Voice &nbsp;·&nbsp; Admin Panel &nbsp;·&nbsp; For authorized use only</div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQZAEJUwfVdJ8-PruuT3OC4VcDciJxttQ",
    authDomain: "daniels-county-civic-voice.firebaseapp.com",
    projectId: "daniels-county-civic-voice",
    storageBucket: "daniels-county-civic-voice.firebasestorage.app",
    messagingSenderId: "312159661337",
    appId: "1:312159661337:web:003232ea86525833442988"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ADMIN_PASSWORD = "daniels2024";
  let authed = false;
  let currentTab = "questions";
  let editingId = null;
  let optCount = 3;
  let allSurveys = [];

  const root = document.getElementById("admin-root");
  const logoutBtn = document.getElementById("logout-btn");

  async function render() {
    if (!authed) { root.innerHTML = buildLogin(); logoutBtn.style.display="none"; return; }
    logoutBtn.style.display = "";
    logoutBtn.onclick = () => { authed=false; render(); };
    root.innerHTML = `<div class="loading"><div class="spinner"></div><br>Loading surveys…</div>`;
    try {
      const snap = await getDocs(collection(db, "surveys"));
      allSurveys = [];
      snap.forEach(d => allSurveys.push({ id:d.id, ...d.data() }));
      allSurveys.sort((a,b) => (b.created?.seconds||0) - (a.created?.seconds||0));
      renderDashboard();
    } catch(e) {
      root.innerHTML = `<div class="alert alert-warn">Error loading data: ${e.message}</div>`;
    }
  }

  function renderDashboard() {
    const openCount = allSurveys.filter(s=>s.status==="open").length;
    let totalVotes = 0;
    allSurveys.forEach(s => { Object.values(s.responses||{}).forEach(v => totalVotes += Number(v)); });

    root.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px">
        <h1 style="font-size:1.4rem">Survey Administration</h1>
        <button class="btn btn-sm" style="border-color:var(--border)" id="export-btn">Export results CSV</button>
      </div>
      <div class="metrics">
        <div class="metric"><div class="num">${allSurveys.length}</div><div class="lbl">Total questions</div></div>
        <div class="metric"><div class="num" style="color:var(--blue)">${openCount}</div><div class="lbl">Currently open</div></div>
        <div class="metric"><div class="num" style="color:var(--green)">${totalVotes}</div><div class="lbl">Total responses</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${currentTab==="questions"?"active":""}" id="tab-questions">Questions &amp; Results</div>
        <div class="tab ${currentTab==="create"?"active":""}" id="tab-create">${editingId?"Edit Question":"+ New Question"}</div>
      </div>
      <div id="tab-body">${currentTab==="questions" ? buildQList() : buildForm()}</div>
    `;

    document.getElementById("tab-questions").onclick = () => { currentTab="questions"; editingId=null; renderDashboard(); };
    document.getElementById("tab-create").onclick = () => { currentTab="create"; renderDashboard(); };
    document.getElementById("export-btn").onclick = exportCSV;

    if (currentTab === "questions") attachQListeners();
    else attachFormListeners();
  }

  function buildLogin() {
    return `<div class="login-wrap"><div class="card">
      <div class="card-label" style="margin-bottom:1rem">Commissioner sign-in</div>
      <div class="field"><label>Password</label><input type="password" id="apass" placeholder="Enter password"></div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-primary" id="login-btn">Sign in</button>
        <span id="lerr" style="font-family:'Arial',sans-serif;font-size:13px;color:var(--red)"></span>
      </div>
    </div></div>`;
  }

  function buildQList() {
    if (!allSurveys.length) return `<div style="text-align:center;color:var(--text-muted);padding:3rem;font-family:'Arial',sans-serif">No questions yet — click "+ New Question" to get started.</div>`;
    const shareBase = window.location.origin + window.location.pathname.replace("admin.html","survey.html");
    return allSurveys.map(s => {
      const resp = s.responses || {};
      const total = Object.values(resp).reduce((a,b)=>a+Number(b),0);
      const bars = (s.options||[]).map((opt,i) => {
        const count = Number(resp[`opt_${i}`]||0);
        const pct = total ? Math.round(count/total*100) : 0;
        return `<div class="bar-row"><span class="bar-label" title="${opt}">${opt}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-count">${count}</span><span class="bar-pct">${pct}%</span></div>`;
      }).join("");
      const comments = s.comments||[];
      let cmtHtml = "";
      if (comments.length) {
        cmtHtml = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)"><div style="font-family:'Arial',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:6px">Written comments (${comments.length})</div>${comments.slice(0,5).map(c=>`<div class="comment-item">${c}</div>`).join("")}${comments.length>5?`<div style="font-size:12px;color:var(--text-hint);font-family:'Arial',sans-serif">…and ${comments.length-5} more</div>`:""}</div>`;
      }
      const bc = s.status==="open"?"badge-open":s.status==="draft"?"badge-draft":"badge-closed";
      const bl = s.status==="open"?"Open":s.status==="draft"?"Draft":"Closed";
      const dateStr = s.created?.seconds ? new Date(s.created.seconds*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
      return `<div class="q-card" id="qc_${s.id}">
        <div class="q-top">
          <div class="q-body">
            <div class="q-text">${s.question}</div>
            <div class="q-meta" style="margin-top:6px"><span class="badge ${bc}">${bl}</span><span>${total} response${total!==1?"s":""}</span><span>${dateStr}</span></div>
          </div>
          <div class="q-actions">
            ${s.status==="open"?`<button class="btn btn-sm q-action" data-id="${s.id}" data-action="close">Close</button>`:""}
            ${s.status==="draft"?`<button class="btn btn-sm btn-primary q-action" data-id="${s.id}" data-action="open">Publish</button>`:""}
            ${s.status==="closed"?`<button class="btn btn-sm btn-success q-action" data-id="${s.id}" data-action="open">Reopen</button>`:""}
            <button class="btn btn-sm q-action" data-id="${s.id}" data-action="edit">Edit</button>
            <button class="btn btn-sm q-action" data-id="${s.id}" data-action="delete" style="color:var(--red);border-color:#f7c1c1;background:var(--red-light)">Delete</button>
          </div>
        </div>
        ${total > 0 ? `<div style="margin-top:12px">${bars}</div>` : ""}
        ${cmtHtml}
        ${s.status==="open"?`<div style="margin-top:12px"><div style="font-family:'Arial',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:5px">Share with residents:</div><div class="share-url">${shareBase}</div><button class="btn btn-sm copy-btn" data-url="${shareBase}">Copy survey link</button></div>`:""}
      </div>`;
    }).join("");
  }

  function attachQListeners() {
    document.querySelectorAll(".q-action").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === "edit") { editingId = id; currentTab = "create"; renderDashboard(); }
        else if (action === "delete") { if(confirm("Delete this question and all responses?")) { await deleteDoc(doc(db,"surveys",id)); await render(); } }
        else if (action === "open" || action === "close") { await updateDoc(doc(db,"surveys",id), { status: action==="open"?"open":"closed" }); await render(); }
      });
    });
    document.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(btn.dataset.url).then(() => { btn.textContent="Copied!"; setTimeout(()=>{btn.textContent="Copy survey link";},2000); });
      });
    });
  }

  function buildForm() {
    let ex = editingId ? allSurveys.find(s=>s.id===editingId) : null;
    const q = ex ? ex.question : "";
    const ctx = ex ? (ex.context||"") : "";
    const opts = ex ? ex.options : ["","",""];
    const ac = ex ? (ex.allowComment||false) : false;
    optCount = opts.length;
    const optsHtml = opts.map((o,i) => `<div class="opt-row" id="or_${i}"><input type="text" id="opt_${i}" value="${o.replace(/"/g,'&quot;')}" placeholder="Option ${i+1}">${i>=2?`<button class="opt-rm" data-i="${i}">×</button>`:`<span style="width:30px"></span>`}</div>`).join("");
    return `<div class="card">
      <div class="field"><label>Question *</label><textarea id="nq" placeholder="What do you want to ask Daniels County residents?">${q}</textarea></div>
      <div class="field"><label>Context for residents (optional)</label><textarea id="nc" placeholder="Brief background — what's being decided and why it matters.">${ctx}</textarea></div>
      <div class="field"><label>Response options * (minimum 2)</label><div class="opt-list" id="opt-list">${optsHtml}</div><button class="btn btn-sm" id="add-opt">+ Add option</button></div>
      <div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px"><input type="checkbox" id="nac" ${ac?"checked":""} style="accent-color:var(--blue)"> Allow optional written comment (anonymous)</label></div>
      <hr style="margin:1.25rem 0">
      <div class="btn-row">
        <button class="btn" id="save-draft">Save as draft</button>
        <button class="btn btn-success" id="save-open">Publish — go live now</button>
        ${editingId?`<button class="btn" id="cancel-edit">Cancel</button>`:""}
      </div>
      <div id="fmsg" style="font-family:'Arial',sans-serif;font-size:13px;color:var(--text-muted);margin-top:10px"></div>
    </div>`;
  }

  function attachFormListeners() {
    document.getElementById("add-opt")?.addEventListener("click", () => {
      const list = document.getElementById("opt-list");
      const i = optCount++;
      const d = document.createElement("div");
      d.className="opt-row"; d.id="or_"+i;
      d.innerHTML=`<input type="text" id="opt_${i}" placeholder="Option ${i+1}"><button class="opt-rm" data-i="${i}">×</button>`;
      list.appendChild(d);
      d.querySelector(".opt-rm").addEventListener("click", () => d.remove());
    });
    document.querySelectorAll(".opt-rm").forEach(btn => {
      btn.addEventListener("click", () => { document.getElementById("or_"+btn.dataset.i)?.remove(); });
    });
    document.getElementById("save-draft")?.addEventListener("click", () => saveQuestion("draft"));
    document.getElementById("save-open")?.addEventListener("click", () => saveQuestion("open"));
    document.getElementById("cancel-edit")?.addEventListener("click", () => { editingId=null; currentTab="questions"; renderDashboard(); });
  }

  async function saveQuestion(status) {
    const q = document.getElementById("nq")?.value||"";
    const ctx = document.getElementById("nc")?.value||"";
    const ac = document.getElementById("nac")?.checked||false;
    const msg = document.getElementById("fmsg");
    if (!q.trim()) { if(msg) msg.textContent="Please enter a question."; return; }
    const opts = [];
    document.querySelectorAll("[id^='opt_']").forEach(el => { if(el.tagName==="INPUT"&&el.value.trim()) opts.push(el.value.trim()); });
    if (opts.length < 2) { if(msg) msg.textContent="Please add at least 2 options."; return; }
    if(msg) msg.textContent = "Saving…";
    try {
      if (editingId) {
        await updateDoc(doc(db,"surveys",editingId), { question:q.trim(), context:ctx.trim(), options:opts, allowComment:ac, status });
        editingId = null;
      } else {
        await addDoc(collection(db,"surveys"), { question:q.trim(), context:ctx.trim(), options:opts, allowComment:ac, status, responses:{}, comments:[], created:serverTimestamp() });
      }
      currentTab = "questions";
      await render();
    } catch(e) {
      if(msg) msg.textContent = "Error saving: " + e.message;
    }
  }

  function exportCSV() {
    let csv = "Question,Option,Responses,Percent,Status,Date Created\n";
    allSurveys.forEach(s => {
      const resp = s.responses||{};
      const total = Object.values(resp).reduce((a,b)=>a+Number(b),0);
      (s.options||[]).forEach((opt,i) => {
        const count = Number(resp[`opt_${i}`]||0);
        const pct = total ? Math.round(count/total*100) : 0;
        const date = s.created?.seconds ? new Date(s.created.seconds*1000).toLocaleDateString() : "";
        csv += `"${s.question.replace(/"/g,'""')}","${opt.replace(/"/g,'""')}",${count},${pct}%,${s.status},"${date}"\n`;
      });
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dcvc-survey-results.csv";
    a.click();
  }

  // Login
  setTimeout(() => {
    const loginBtn = document.getElementById("login-btn");
    if (loginBtn) {
      loginBtn.addEventListener("click", () => {
        const p = document.getElementById("apass")?.value||"";
        if (p === ADMIN_PASSWORD) { authed=true; render(); }
        else { const e=document.getElementById("lerr"); if(e) e.textContent="Incorrect password."; }
      });
      document.getElementById("apass")?.addEventListener("keydown", e => { if(e.key==="Enter") loginBtn.click(); });
    }
  }, 100);

  render();
</script>

<script>
function toggleMenu() { document.getElementById('nav-links').classList.toggle('open'); }
</script>
</body>
</html>
