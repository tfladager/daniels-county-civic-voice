<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Daniels County Civic Voice</title>
<link rel="stylesheet" href="style.css">
<style>
  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.5rem; }
  .metric { background: var(--bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 14px; text-align: center; }
  .metric .num { font-size: 26px; font-weight: bold; }
  .metric .lbl { font-family: 'Arial', sans-serif; font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 9px 18px; font-family: 'Arial', sans-serif; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); margin-bottom: -1px; }
  .tab.active { border-bottom-color: var(--blue); color: var(--blue); font-weight: bold; }
  .q-card { border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; background: var(--bg); }
  .q-top { display: flex; align-items: flex-start; gap: 12px; }
  .q-body { flex: 1; }
  .q-text { font-size: 15px; font-weight: bold; margin-bottom: 6px; line-height: 1.4; }
  .q-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: 'Arial', sans-serif; font-size: 12px; color: var(--text-muted); }
  .q-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-family: 'Arial', sans-serif; font-size: 13px; }
  .bar-label { width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
  .bar-track { flex: 1; background: var(--bg-surface2); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width 0.4s; }
  .bar-count { width: 32px; text-align: right; font-weight: bold; }
  .bar-pct { width: 36px; color: var(--text-hint); }
  .opt-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .opt-row { display: flex; align-items: center; gap: 8px; }
  .opt-row input { flex: 1; }
  .opt-rm { width: 30px; height: 30px; border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 18px; flex-shrink: 0; }
  .comment-item { font-family: 'Arial', sans-serif; font-size: 13px; padding: 6px 10px; background: var(--bg-surface); border-radius: var(--radius); margin-bottom: 4px; }
  .share-url { background: var(--bg-surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-muted); word-break: break-all; margin-bottom: 6px; }
  .login-wrap { max-width: 360px; margin: 3rem auto; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <div class="nav-seal">DC</div>
      <div>
        <div class="nav-title">Daniels County Civic Voice</div>
        <div class="nav-sub">Admin Panel</div>
      </div>
    </a>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="index.html" class="btn btn-outline btn-sm">&#8592; View site</a>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="display:none">Sign out</button>
    </div>
  </div>
</nav>

<div class="page">
  <div id="admin-root"><div class="loading"><div class="spinner"></div><br>Loading…</div></div>
</div>

<footer class="site-footer">
  <div>Daniels County Civic Voice &nbsp;·&nbsp; Admin Panel &nbsp;·&nbsp; For authorized use only</div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQZAEJUwfVdJ8-PruuT3OC4VcDciJxttQ",
    authDomain: "daniels-county-civic-voice.firebaseapp.com",
    projectId: "daniels-county-civic-voice",
    storageBucket: "daniels-county-civic-voice.firebasestorage.app",
    messagingSenderId: "312159661337",
    appId: "1:312159661337:web:003232ea86525833442988"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let authed = false;
  let currentSection = "surveys";
  let currentTab = "questions";
  let editingId = null;
  let optCount = 3;
  let allSurveys = [];
  let allNotes = [];
  let currentNoteTab = "list";
  let editingNoteId = null;
  let expandedComments = new Set();

  const root = document.getElementById("admin-root");
  const logoutBtn = document.getElementById("logout-btn");

  async function render() {
    if (!authed) { root.innerHTML = buildLogin(); logoutBtn.style.display = "none"; attachLoginListeners(); return; }
    logoutBtn.style.display = "";
    logoutBtn.onclick = () => { currentSection = "surveys"; signOut(auth); };
    root.innerHTML = `<div class="loading"><div class="spinner"></div><br>Loading…</div>`;
    try {
      const snap = await getDocs(collection(db, "surveys"));
      allSurveys = [];
      snap.forEach(d => allSurveys.push({ id: d.id, ...d.data() }));
      allSurveys.sort((a,b) => (b.created?.seconds||0) - (a.created?.seconds||0));

      const nsnap = await getDocs(collection(db, "notes"));
      allNotes = [];
      nsnap.forEach(d => allNotes.push({ id: d.id, ...d.data() }));
      allNotes.sort((a,b) => (b.created?.seconds||0) - (a.created?.seconds||0));

      renderShell();
    } catch(e) {
      root.innerHTML = `<div class="alert alert-warn">Error loading data: ${e.message}</div>`;
    }
  }

  function renderShell() {
    root.innerHTML = `
      <div class="tabs" style="margin-bottom:1.5rem">
        <div class="tab ${currentSection==="surveys"?"active":""}" id="sec-surveys">Surveys</div>
        <div class="tab ${currentSection==="notes"?"active":""}" id="sec-notes">Commissioner's Notes</div>
      </div>
      <div id="section-body"></div>
    `;
    document.getElementById("sec-surveys").onclick = () => { currentSection="surveys"; renderShell(); };
    document.getElementById("sec-notes").onclick = () => { currentSection="notes"; renderShell(); };
    if (currentSection === "surveys") renderDashboard();
    else renderNotesDashboard();
  }

  function buildLogin() {
    return `<div class="login-wrap"><div class="card">
      <div class="card-label" style="margin-bottom:1rem">Commissioner sign-in</div>
      <div class="field"><label>Email</label><input type="email" id="aemail" placeholder="Enter email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="apass" placeholder="Enter password" autocomplete="current-password"></div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-primary" id="login-btn">Sign in</button>
        <span id="lerr" style="font-family:'Arial',sans-serif;font-size:13px;color:var(--red)"></span>
      </div>
    </div></div>`;
  }

  function attachLoginListeners() {
    setTimeout(() => {
      const btn = document.getElementById("login-btn");
      const inp = document.getElementById("apass");
      if (btn) btn.addEventListener("click", doLogin);
      if (inp) inp.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
    }, 50);
  }

  async function doLogin() {
    const email = (document.getElementById("aemail")||{}).value||"";
    const p = (document.getElementById("apass")||{}).value||"";
    const errEl = document.getElementById("lerr");
    if (errEl) errEl.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, p);
      // onAuthStateChanged will flip `authed` and re-render.
    } catch (e) {
      if (errEl) errEl.textContent = "Incorrect email or password.";
    }
  }

  function renderDashboard() {
    const openCount = allSurveys.filter(s => s.status === "open").length;
    let totalVotes = 0;
    allSurveys.forEach(s => { Object.values(s.responses||{}).forEach(v => totalVotes += Number(v)); });
    const shareBase = window.location.origin + window.location.pathname.replace("admin.html","survey.html");

    document.getElementById("section-body").innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px">
        <h1 style="font-size:1.4rem">Survey Administration</h1>
        <button class="btn btn-sm" style="border:1px solid var(--border)" id="export-btn">Export CSV</button>
      </div>
      <div class="metrics">
        <div class="metric"><div class="num">${allSurveys.length}</div><div class="lbl">Total questions</div></div>
        <div class="metric"><div class="num" style="color:var(--blue)">${openCount}</div><div class="lbl">Currently open</div></div>
        <div class="metric"><div class="num" style="color:var(--green)">${totalVotes}</div><div class="lbl">Total responses</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${currentTab==="questions"?"active":""}" id="tab-q">Questions &amp; Results</div>
        <div class="tab ${currentTab==="create"?"active":""}" id="tab-c">${editingId ? "Edit Question" : "+ New Question"}</div>
      </div>
      <div id="tab-body">${currentTab==="questions" ? buildQList(shareBase) : buildForm()}</div>
    `;

    document.getElementById("tab-q").onclick = () => { currentTab="questions"; editingId=null; renderDashboard(); };
    document.getElementById("tab-c").onclick = () => { currentTab="create"; renderDashboard(); };
    document.getElementById("export-btn").onclick = exportCSV;
    if (currentTab === "questions") attachQListeners();
    else attachFormListeners();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }

  function buildQList(shareBase) {
    if (!allSurveys.length) return `<div style="text-align:center;color:var(--text-muted);padding:3rem;font-family:'Arial',sans-serif;font-size:14px">No questions yet — click "+ New Question" to get started.</div>`;
    return allSurveys.map(s => {
      const resp = s.responses || {};
      const total = Object.values(resp).reduce((a,b) => a+Number(b), 0);
      const bars = (s.options||[]).map((opt,i) => {
        const count = Number(resp[`opt_${i}`]||0);
        const pct = total ? Math.round(count/total*100) : 0;
        return `<div class="bar-row">
          <span class="bar-label" title="${opt}">${opt}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="bar-count">${count}</span>
          <span class="bar-pct">${pct}%</span>
        </div>`;
      }).join("");
      const comments = s.comments||[];
      let cmtHtml = "";
      if (comments.length) {
        const isExpanded = expandedComments.has(s.id);
        const shown = isExpanded ? comments : comments.slice(0,5);
        const remaining = comments.length - shown.length;
        cmtHtml = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)">
          <div style="font-family:'Arial',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:6px">Written comments (${comments.length})</div>
          ${shown.map((c,idx)=>`<div class="comment-item" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
            <span style="flex:1">${escapeHtml(c)}</span>
            <button class="cmt-delete" data-id="${s.id}" data-idx="${idx}" title="Delete this comment" style="border:none;background:none;color:var(--text-hint);cursor:pointer;font-size:14px;line-height:1;flex-shrink:0">&#10005;</button>
          </div>`).join("")}
          ${remaining>0?`<button class="btn btn-sm cmt-toggle" data-id="${s.id}" style="margin-top:4px">Show ${remaining} more</button>`:""}
          ${isExpanded && comments.length>5?`<button class="btn btn-sm cmt-toggle" data-id="${s.id}" style="margin-top:4px">Show less</button>`:""}
        </div>`;
      }
      const bc = s.status==="open"?"badge-open":s.status==="draft"?"badge-draft":"badge-closed";
      const bl = s.status==="open"?"Open":s.status==="draft"?"Draft":"Closed";
      const dateStr = s.created?.seconds ? new Date(s.created.seconds*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
      return `<div class="q-card">
        <div class="q-top">
          <div class="q-body">
            <div class="q-text">${s.question}</div>
            <div class="q-meta" style="margin-top:6px">
              <span class="badge ${bc}">${bl}</span>
              <span>${total} response${total!==1?"s":""}</span>
              <span>${dateStr}</span>
            </div>
          </div>
          <div class="q-actions">
            ${s.status==="open"?`<button class="btn btn-sm q-act" data-id="${s.id}" data-act="close">Close</button>`:""}
            ${s.status==="draft"?`<button class="btn btn-sm btn-primary q-act" data-id="${s.id}" data-act="open">Publish</button>`:""}
            ${s.status==="closed"?`<button class="btn btn-sm btn-success q-act" data-id="${s.id}" data-act="open">Reopen</button>`:""}
            <button class="btn btn-sm q-act" data-id="${s.id}" data-act="edit">Edit</button>
            <button class="btn btn-sm q-act" data-id="${s.id}" data-act="delete" style="color:var(--red);border-color:#f7c1c1;background:var(--red-light)">Delete</button>
          </div>
        </div>
        ${total > 0 ? `<div style="margin-top:12px">${bars}</div>` : ""}
        ${cmtHtml}
        ${s.status==="open" ? `<div style="margin-top:12px">
          <div style="font-family:'Arial',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:5px">Share this link with residents:</div>
          <div class="share-url">${shareBase}</div>
          <button class="btn btn-sm copy-btn" data-url="${shareBase}">Copy survey link</button>
        </div>` : ""}
      </div>`;
    }).join("");
  }

  function attachQListeners() {
    document.querySelectorAll(".q-act").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id, act = btn.dataset.act;
        if (act === "edit") { editingId = id; currentTab = "create"; renderDashboard(); }
        else if (act === "delete") { if(confirm("Delete this question and all responses? This cannot be undone.")) { await deleteDoc(doc(db,"surveys",id)); await render(); } }
        else { await updateDoc(doc(db,"surveys",id), { status: act==="open"?"open":"closed" }); await render(); }
      });
    });
    document.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(btn.dataset.url).then(() => { btn.textContent="Copied!"; setTimeout(()=>{btn.textContent="Copy survey link";},2000); });
      });
    });
    document.querySelectorAll(".cmt-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        if (expandedComments.has(id)) expandedComments.delete(id); else expandedComments.add(id);
        renderDashboard();
      });
    });
    document.querySelectorAll(".cmt-delete").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id, idx = Number(btn.dataset.idx);
        const survey = allSurveys.find(s => s.id === id);
        const rawComment = survey?.comments?.[idx];
        if (rawComment === undefined) return;
        if (!confirm("Delete this comment permanently? This cannot be undone.")) return;
        await updateDoc(doc(db,"surveys",id), { comments: arrayRemove(rawComment) });
        await render();
      });
    });
  }

  function buildForm() {
    const ex = editingId ? allSurveys.find(s=>s.id===editingId) : null;
    const q = ex ? ex.question : "";
    const ctx = ex ? (ex.context||"") : "";
    const opts = ex ? ex.options : ["","",""];
    const ac = ex ? (ex.allowComment||false) : false;
    optCount = opts.length;
    const optsHtml = opts.map((o,i) => `
      <div class="opt-row" id="or_${i}">
        <input type="text" id="opt_${i}" value="${o.replace(/"/g,'&quot;')}" placeholder="Option ${i+1}">
        ${i>=2?`<button class="opt-rm" data-i="${i}">×</button>`:`<span style="width:30px"></span>`}
      </div>`).join("");
    return `<div class="card">
      <div class="field"><label>Question *</label><textarea id="nq" placeholder="What do you want to ask Daniels County residents?">${q}</textarea></div>
      <div class="field"><label>Context for residents (optional)</label><textarea id="nc" placeholder="Brief background — what's being decided and why it matters.">${ctx}</textarea></div>
      <div class="field">
        <label>Response options * (minimum 2)</label>
        <div class="opt-list" id="opt-list">${optsHtml}</div>
        <button class="btn btn-sm" id="add-opt">+ Add option</button>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px">
          <input type="checkbox" id="nac" ${ac?"checked":""} style="accent-color:var(--blue)">
          Allow optional written comment (anonymous)
        </label>
      </div>
      <hr>
      <div class="btn-row">
        <button class="btn" id="save-draft">Save as draft</button>
        <button class="btn btn-success" id="save-open">Publish — go live now</button>
        ${editingId?`<button class="btn" id="cancel-edit">Cancel</button>`:""}
      </div>
      <div id="fmsg" style="font-family:'Arial',sans-serif;font-size:13px;color:var(--text-muted);margin-top:10px"></div>
    </div>`;
  }

  function attachFormListeners() {
    document.getElementById("add-opt")?.addEventListener("click", () => {
      const list = document.getElementById("opt-list");
      const i = optCount++;
      const d = document.createElement("div");
      d.className="opt-row"; d.id="or_"+i;
      d.innerHTML=`<input type="text" id="opt_${i}" placeholder="Option ${i+1}"><button class="opt-rm" data-i="${i}">×</button>`;
      list.appendChild(d);
      d.querySelector(".opt-rm").addEventListener("click", () => d.remove());
    });
    document.querySelectorAll(".opt-rm").forEach(btn => {
      btn.addEventListener("click", () => document.getElementById("or_"+btn.dataset.i)?.remove());
    });
    document.getElementById("save-draft")?.addEventListener("click", () => saveQ("draft"));
    document.getElementById("save-open")?.addEventListener("click", () => saveQ("open"));
    document.getElementById("cancel-edit")?.addEventListener("click", () => { editingId=null; currentTab="questions"; renderDashboard(); });
  }

  async function saveQ(status) {
    const q = document.getElementById("nq")?.value||"";
    const ctx = document.getElementById("nc")?.value||"";
    const ac = document.getElementById("nac")?.checked||false;
    const msg = document.getElementById("fmsg");
    if (!q.trim()) { if(msg) msg.textContent="Please enter a question."; return; }
    const opts = [];
    document.querySelectorAll("[id^='opt_']").forEach(el => { if(el.tagName==="INPUT"&&el.value.trim()) opts.push(el.value.trim()); });
    if (opts.length < 2) { if(msg) msg.textContent="Please add at least 2 options."; return; }
    if(msg) msg.textContent = "Saving…";
    try {
      if (editingId) {
        await updateDoc(doc(db,"surveys",editingId), { question:q.trim(), context:ctx.trim(), options:opts, allowComment:ac, status });
        editingId = null;
      } else {
        await addDoc(collection(db,"surveys"), { question:q.trim(), context:ctx.trim(), options:opts, allowComment:ac, status, responses:{}, comments:[], created:serverTimestamp() });
      }
      currentTab = "questions";
      await render();
    } catch(e) {
      if(msg) msg.textContent = "Error saving: " + e.message;
    }
  }

  function renderNotesDashboard() {
    const publishedCount = allNotes.filter(n => n.status === "published").length;
    document.getElementById("section-body").innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px">
        <h1 style="font-size:1.4rem">Commissioner's Notes</h1>
      </div>
      <div class="metrics">
        <div class="metric"><div class="num">${allNotes.length}</div><div class="lbl">Total notes</div></div>
        <div class="metric"><div class="num" style="color:var(--green)">${publishedCount}</div><div class="lbl">Published</div></div>
        <div class="metric"><div class="num" style="color:var(--amber)">${allNotes.length-publishedCount}</div><div class="lbl">Drafts</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${currentNoteTab==="list"?"active":""}" id="ntab-list">All Notes</div>
        <div class="tab ${currentNoteTab==="create"?"active":""}" id="ntab-create">${editingNoteId ? "Edit Note" : "+ New Note"}</div>
      </div>
      <div id="ntab-body">${currentNoteTab==="list" ? buildNoteList() : buildNoteForm()}</div>
    `;
    document.getElementById("ntab-list").onclick = () => { currentNoteTab="list"; editingNoteId=null; renderNotesDashboard(); };
    document.getElementById("ntab-create").onclick = () => { currentNoteTab="create"; renderNotesDashboard(); };
    if (currentNoteTab === "list") attachNoteListeners();
    else attachNoteFormListeners();
  }

  function buildNoteList() {
    if (!allNotes.length) return `<div style="text-align:center;color:var(--text-muted);padding:3rem;font-family:'Arial',sans-serif;font-size:14px">No notes yet — click "+ New Note" to write your first one.</div>`;
    return allNotes.map(n => {
      const bc = n.status==="published" ? "badge-open" : "badge-draft";
      const bl = n.status==="published" ? "Published" : "Draft";
      const dateStr = n.created?.seconds ? new Date(n.created.seconds*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
      const preview = (n.body||"").slice(0,140) + ((n.body||"").length>140?"…":"");
      return `<div class="q-card">
        <div class="q-top">
          <div class="q-body">
            <div class="q-text">${n.title}</div>
            <div class="q-meta" style="margin-top:6px">
              <span class="badge ${bc}">${bl}</span>
              <span>${dateStr}</span>
            </div>
            <div style="font-family:'Arial',sans-serif;font-size:13px;color:var(--text-muted);margin-top:8px">${preview}</div>
          </div>
          <div class="q-actions">
            ${n.status==="draft"?`<button class="btn btn-sm n-act" data-id="${n.id}" data-act="publish">Publish</button>`:""}
            ${n.status==="published"?`<button class="btn btn-sm n-act" data-id="${n.id}" data-act="unpublish">Unpublish</button>`:""}
            <button class="btn btn-sm n-act" data-id="${n.id}" data-act="edit">Edit</button>
            <button class="btn btn-sm n-act" data-id="${n.id}" data-act="delete" style="color:var(--red);border-color:#f7c1c1;background:var(--red-light)">Delete</button>
          </div>
        </div>
      </div>`;
    }).join("");
  }

  function attachNoteListeners() {
    document.querySelectorAll(".n-act").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id, act = btn.dataset.act;
        if (act === "edit") { editingNoteId = id; currentNoteTab = "create"; renderNotesDashboard(); }
        else if (act === "delete") { if(confirm("Delete this note? This cannot be undone.")) { await deleteDoc(doc(db,"notes",id)); await render(); } }
        else { await updateDoc(doc(db,"notes",id), { status: act==="publish"?"published":"draft" }); await render(); }
      });
    });
  }

  function buildNoteForm() {
    const ex = editingNoteId ? allNotes.find(n=>n.id===editingNoteId) : null;
    const title = ex ? ex.title : "";
    const body = ex ? ex.body : "";
    return `<div class="card">
      <div class="field"><label>Title *</label><input type="text" id="nn-title" value="${(title||"").replace(/"/g,'&quot;')}" placeholder="e.g. Update on the roping barn discussion"></div>
      <div class="field"><label>Note *</label><textarea id="nn-body" style="min-height:220px" placeholder="Write the update here. Separate paragraphs with a blank line.">${body||""}</textarea></div>
      <div style="font-family:'Arial',sans-serif;font-size:12px;color:var(--text-hint);margin-bottom:1rem">Keep it factual and nonpartisan — this is public-facing. Separate paragraphs with a blank line between them.</div>
      <hr>
      <div class="btn-row">
        <button class="btn" id="nn-save-draft">Save as draft</button>
        <button class="btn btn-success" id="nn-save-pub">Publish — go live now</button>
        ${editingNoteId?`<button class="btn" id="nn-cancel">Cancel</button>`:""}
      </div>
      <div id="nn-msg" style="font-family:'Arial',sans-serif;font-size:13px;color:var(--text-muted);margin-top:10px"></div>
    </div>`;
  }

  function attachNoteFormListeners() {
    document.getElementById("nn-save-draft")?.addEventListener("click", () => saveNote("draft"));
    document.getElementById("nn-save-pub")?.addEventListener("click", () => saveNote("published"));
    document.getElementById("nn-cancel")?.addEventListener("click", () => { editingNoteId=null; currentNoteTab="list"; renderNotesDashboard(); });
  }

  async function saveNote(status) {
    const title = document.getElementById("nn-title")?.value||"";
    const body = document.getElementById("nn-body")?.value||"";
    const msg = document.getElementById("nn-msg");
    if (!title.trim()) { if(msg) msg.textContent="Please enter a title."; return; }
    if (!body.trim()) { if(msg) msg.textContent="Please write the note content."; return; }
    if(msg) msg.textContent = "Saving…";
    try {
      if (editingNoteId) {
        await updateDoc(doc(db,"notes",editingNoteId), { title:title.trim(), body:body.trim(), status });
        editingNoteId = null;
      } else {
        await addDoc(collection(db,"notes"), { title:title.trim(), body:body.trim(), status, created:serverTimestamp() });
      }
      currentNoteTab = "list";
      await render();
    } catch(e) {
      if(msg) msg.textContent = "Error saving: " + e.message;
    }
  }

  function exportCSV() {
    let csv = "Question,Option,Responses,Percent,Status,Date\n";
    allSurveys.forEach(s => {
      const resp = s.responses||{};
      const total = Object.values(resp).reduce((a,b)=>a+Number(b),0);
      (s.options||[]).forEach((opt,i) => {
        const count = Number(resp[`opt_${i}`]||0);
        const pct = total ? Math.round(count/total*100) : 0;
        const date = s.created?.seconds ? new Date(s.created.seconds*1000).toLocaleDateString() : "";
        csv += `"${s.question.replace(/"/g,'""')}","${opt.replace(/"/g,'""')}",${count},${pct}%,${s.status},"${date}"\n`;
      });
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dcvc-results.csv";
    a.click();
  }

  onAuthStateChanged(auth, (user) => { authed = !!user; render(); });
</script>
<script>function toggleMenu() { document.getElementById('nav-links').classList.toggle('open'); }</script>
</body>
</html>
